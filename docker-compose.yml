services:
  butler:
    build: .
    container_name: butler
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Always win over whatever's in .env (even a blank value there),
      # so data always lands on the persisted volume below rather than
      # silently falling back to a path inside the container's own
      # writable layer, which would vanish on the next recreate.
      MUSIC_DIR: /data/music
      DATABASE_URL: /data/butler.db
      SONGS_DB_PATH: /data/songs_meta.db
      UPLOADS_DIR: /data/uploads
      # Optional: index and stream an existing library in place (see README,
      # "Existing Music Library"). Uncomment together with the volume below.
      # LIBRARY_DIR: /library
    volumes:
      - butler_data:/data
      # A real host folder (not just the named volume) so it's easy to drop
      # files in from outside Docker -- over SMB/NAS, scp, a file manager,
      # whatever's convenient -- without needing to exec into the container.
      - ./uploads:/data/uploads
      # Optional: your existing library, mounted READ-ONLY. Butler indexes and
      # streams from it directly -- nothing is copied, and nothing under it is
      # ever modified or deleted. Adjust the host path, then uncomment.
      # - /mnt/data/media/music:/library:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  butler_data:
    name: butler_data
